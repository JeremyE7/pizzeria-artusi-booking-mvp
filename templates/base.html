<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d9412c">
  <title>{% block title %}Pizzería Artusi · Reservas por chat{% endblock %}</title>
  <meta name="description" content="Pizzería Artusi: pide tu mesa por chat, confirma tu comanda y ven a comer. Demo de reservas con Python, FastAPI y PostgreSQL.">
  <link rel="icon" type="image/svg+xml" href="/static/pizza.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Courier+Prime:wght@400;700&family=Lilita+One&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fff2d2;
      --cream-2: #ffe6b0;
      --paper: #fffaf0;
      --paper-deep: #f7e9cd;
      --tomato: #d9412c;
      --tomato-dark: #a92c1d;
      --cheese: #f6c445;
      --cheese-deep: #d9a21e;
      --basil: #3e7d3a;
      --basil-dark: #2d5f2b;
      --wood: #8a5a35;
      --wood-dark: #4e2d1b;
      --ink: #2b1a12;
      --muted: #7c6248;
      --line: #dcc49b;
      --shadow: #c9a46b;
      --white: #fffdf6;
      --display: "Lilita One", "Arial Black", Impact, sans-serif;
      --body: "Baloo 2", "Nunito", ui-sans-serif, system-ui, sans-serif;
      --mono: "Courier Prime", "Courier New", monospace;
      --chalk: "Patrick Hand", "Comic Sans MS", cursive;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      background-color: #f7e6c3;
      background-image:
        linear-gradient(45deg, rgba(217, 65, 44, .035) 25%, transparent 25%, transparent 75%, rgba(217, 65, 44, .035) 75%),
        linear-gradient(45deg, rgba(217, 65, 44, .035) 25%, transparent 25%, transparent 75%, rgba(217, 65, 44, .035) 75%);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
    }

    ::selection { background: var(--cheese); color: var(--ink); }

    a { color: inherit; }

    :focus-visible {
      outline: 3px dashed var(--tomato);
      outline-offset: 3px;
    }

    .page {
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
    }

    h1, h2, h3, p { margin-top: 0; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    /* Awning + header */
    .awning {
      height: 24px;
      background: repeating-linear-gradient(
        90deg,
        var(--tomato) 0 48px,
        var(--cream) 48px 96px
      );
      border-bottom: 3px solid var(--ink);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--cream);
      border-bottom: 3px solid var(--ink);
      box-shadow: 0 4px 0 rgba(43, 26, 18, .12);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 82px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      text-decoration: none;
      white-space: nowrap;
    }

    .brand-chef {
      width: 56px;
      height: 56px;
      flex: none;
      filter: drop-shadow(2px 3px 0 rgba(43, 26, 18, .16));
    }

    .brand-copy { display: flex; flex-direction: column; line-height: 1; }

    .brand-name {
      font-family: var(--display);
      font-size: 1.95rem;
      font-weight: 400;
      letter-spacing: .01em;
    }

    .brand-name strong {
      color: var(--tomato);
      font-weight: 400;
    }

    .brand-sub {
      margin-top: 5px;
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .site-nav a {
      padding: 6px 2px;
      border-bottom: 3px solid transparent;
      color: var(--ink);
      font-family: var(--display);
      font-size: .9rem;
      font-weight: 400;
      letter-spacing: .03em;
      text-decoration: none;
      transition: color .15s ease, border-color .15s ease;
    }

    .site-nav a:hover { color: var(--tomato); border-color: var(--tomato); }

    .open-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px 5px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--basil);
      box-shadow: 2px 2px 0 var(--ink);
      color: #fff8e8;
      font-family: var(--display);
      font-size: .7rem;
      letter-spacing: .06em;
      white-space: nowrap;
    }

    .open-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #b8f28d;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, .25);
    }

    /* Marquee */
    .marquee {
      background: var(--wood-dark);
      border-bottom: 3px solid var(--ink);
      color: var(--cream);
      overflow: hidden;
    }

    .marquee-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 26px;
      min-height: 34px;
      font-family: var(--mono);
      font-size: .61rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .marquee-inner span {
      display: inline-flex;
      align-items: center;
      gap: 26px;
    }

    .marquee-inner span::after {
      content: "★";
      color: var(--cheese);
      font-size: .72rem;
    }

    .marquee-inner span:last-child::after { content: ""; }

    /* Buttons and shared bits */
    .btn-3d {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px 19px 11px;
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: var(--tomato);
      box-shadow: 5px 5px 0 var(--ink);
      color: #fff8e8;
      font-family: var(--display);
      font-size: .98rem;
      font-weight: 400;
      letter-spacing: .03em;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
    }

    .btn-3d:hover {
      background: var(--tomato-dark);
      transform: translate(-1px, -1px);
      box-shadow: 6px 6px 0 var(--ink);
    }

    .btn-3d:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--ink);
    }

    .btn-3d.alt { background: var(--cheese); color: var(--ink); }
    .btn-3d.alt:hover { background: var(--cheese-deep); }

    .link-chalk {
      padding-bottom: 3px;
      border-bottom: 2px dashed var(--wood);
      color: var(--ink);
      font-family: var(--mono);
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .link-chalk:hover { color: var(--tomato); border-color: var(--tomato); }

    /* Scene intro */
    .scene-head {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr);
      gap: 28px;
      align-items: center;
      padding: 30px 0 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      padding: 5px 10px 4px;
      border: 2px solid var(--ink);
      border-radius: 5px;
      background: var(--cheese);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: var(--display);
      font-size: .7rem;
      letter-spacing: .06em;
      text-transform: uppercase;
      transform: rotate(-1deg);
    }

    .scene-copy h1 {
      margin: 12px 0 10px;
      font-family: var(--display);
      font-size: clamp(2.7rem, 5.4vw, 4.8rem);
      font-weight: 400;
      line-height: .92;
      letter-spacing: .01em;
      text-shadow: 3px 3px 0 rgba(246, 196, 69, .55);
    }

    .scene-copy h1 em {
      color: var(--tomato);
      font-style: normal;
      text-shadow: 3px 3px 0 var(--cheese);
    }

    .lede {
      max-width: 56ch;
      margin-bottom: 0;
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.55;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
      margin-top: 20px;
    }

    .scene-art {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 250px;
    }

    .scene-plate {
      position: relative;
      display: grid;
      place-items: center;
      width: 228px;
      height: 228px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff8e4 0 58%, #f2d9a6 59% 63%, transparent 64%);
    }

    .scene-plate::after {
      content: "";
      position: absolute;
      inset: 17px;
      border: 2px dashed rgba(78, 45, 27, .35);
      border-radius: 50%;
    }

    .scene-plate img {
      position: relative;
      z-index: 1;
      width: 188px;
      filter: drop-shadow(3px 5px 0 rgba(43, 26, 18, .16));
      animation: bob 4s ease-in-out infinite;
    }

    .chef-bubble {
      position: absolute;
      top: 4px;
      right: 0;
      z-index: 2;
      max-width: 190px;
      padding: 10px 13px;
      border: 3px solid var(--ink);
      border-radius: 16px 16px 16px 5px;
      background: var(--white);
      box-shadow: 4px 4px 0 var(--shadow);
      font-size: .86rem;
      font-weight: 800;
      line-height: 1.25;
      transform: rotate(2deg);
    }

    .chef-bubble::before {
      content: "";
      position: absolute;
      left: -6px;
      bottom: 17px;
      z-index: 1;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 9px solid var(--white);
    }

    .chef-bubble::after {
      content: "";
      position: absolute;
      left: -12px;
      bottom: 14px;
      border-top: 9px solid transparent;
      border-bottom: 9px solid transparent;
      border-right: 13px solid var(--ink);
    }

    .specials-sticker {
      position: absolute;
      bottom: 0;
      left: 0;
      padding: 7px 11px 6px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: var(--tomato);
      box-shadow: 4px 4px 0 var(--ink);
      color: #fff8e8;
      font-family: var(--display);
      font-size: .7rem;
      letter-spacing: .05em;
      transform: rotate(-3deg);
    }

    /* Main game layout */
    .salon-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(300px, .65fr);
      gap: 28px;
      align-items: start;
      padding-bottom: 34px;
    }

    .table-card {
      position: relative;
      margin-top: 10px;
      padding: 16px;
      border: 4px solid var(--wood-dark);
      border-radius: 20px;
      background-color: var(--tomato);
      background-image: repeating-conic-gradient(var(--cream) 0% 25%, transparent 0% 50%);
      background-size: 36px 36px;
      box-shadow: 8px 8px 0 var(--wood-dark);
    }

    .table-sign {
      position: absolute;
      top: -17px;
      left: 50%;
      z-index: 3;
      transform: translateX(-50%) rotate(-1deg);
      padding: 6px 16px 5px;
      border: 3px solid var(--ink);
      border-radius: 8px;
      background: var(--wood);
      box-shadow: 3px 3px 0 var(--ink);
      color: var(--cream);
      font-family: var(--display);
      font-size: .84rem;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .table-surface {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 650px;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 13px;
      background: var(--paper);
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 14px;
      border-bottom: 3px solid var(--ink);
      background: var(--cheese);
    }

    .waiter {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }

    .waiter-avatar {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      flex: none;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--cream);
      box-shadow: 2px 2px 0 rgba(43, 26, 18, .28);
    }

    .waiter-avatar img { width: 40px; height: 40px; }

    .chat-title {
      margin: 0;
      font-family: var(--display);
      font-size: 1.16rem;
      font-weight: 400;
      line-height: 1;
    }

    .chat-sub {
      margin-top: 3px;
      color: rgba(43, 26, 18, .68);
      font-family: var(--mono);
      font-size: .54rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--basil-dark);
      font-family: var(--display);
      font-size: .66rem;
      white-space: nowrap;
    }

    .online::before {
      content: "";
      width: 8px;
      height: 8px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--basil);
    }

    .chat-log {
      display: flex;
      flex: 1 1 0;
      flex-direction: column;
      gap: 15px;
      min-height: 0;
      height: auto;
      padding: 18px 15px 16px;
      overflow-y: auto;
      scrollbar-color: var(--wood) transparent;
      scrollbar-width: thin;
      background: var(--paper);
    }

    .msg {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      max-width: 92%;
      animation: rise .2s ease both;
    }

    .msg-bot { align-self: flex-start; }
    .msg-user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      flex: none;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--cheese);
    }

    .msg-avatar img { width: 27px; height: 27px; }

    .msg-content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .msg-bot .msg-content { min-width: 280px; }

    .msg-user .msg-content { align-items: flex-end; }

    .msg-meta {
      margin-bottom: 4px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .54rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .bubble {
      padding: 9px 12px;
      border: 2px solid var(--ink);
      font-size: .9rem;
      font-weight: 500;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .bubble-bot {
      border-radius: 4px 14px 14px 14px;
      background: var(--white);
      box-shadow: 3px 3px 0 var(--shadow);
    }

    .bubble-user {
      border-radius: 14px 4px 14px 14px;
      background: var(--tomato);
      box-shadow: 3px 3px 0 var(--wood-dark);
      color: #fff8e8;
    }

    /* Receipt on table */
    .receipt {
      position: relative;
      width: 100%;
      margin-top: 9px;
      padding: 12px;
      border: 2px dashed var(--ink);
      border-radius: 6px;
      background: var(--white);
      box-shadow: 4px 4px 0 var(--cheese);
      color: var(--ink);
      font-family: var(--mono);
      font-size: .66rem;
      line-height: 1.5;
    }

    .receipt-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 7px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line);
    }

    .receipt-tag {
      padding: 2px 7px;
      border: 2px solid var(--ink);
      border-radius: 3px;
      background: var(--tomato);
      color: #fff8e8;
      font-family: var(--display);
      font-size: .58rem;
      letter-spacing: .07em;
    }

    .receipt-stamp {
      padding: 2px 5px;
      border: 2px solid var(--basil);
      border-radius: 3px;
      color: var(--basil);
      font-family: var(--display);
      font-size: .53rem;
      letter-spacing: .04em;
      opacity: .78;
      transform: rotate(5deg);
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .receipt-row strong {
      max-width: 66%;
      color: var(--ink);
      font-weight: 700;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .receipt-link {
      display: inline-block;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid var(--line);
      color: var(--tomato);
      font-family: var(--display);
      font-size: .62rem;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 21px;
      padding: 8px 12px;
      border: 2px solid var(--ink);
      border-radius: 4px 14px 14px 14px;
      background: var(--white);
      box-shadow: 3px 3px 0 var(--shadow);
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--wood);
      animation: blink 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    .chat-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      border-top: 3px solid var(--ink);
      background: var(--cream-2);
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      padding: 9px 12px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: var(--white);
      box-shadow: inset 2px 2px 0 rgba(43, 26, 18, .08);
      color: var(--ink);
      font-family: var(--body);
      font-size: .9rem;
      font-weight: 600;
      outline: none;
    }

    .chat-input::placeholder { color: #a88d6d; }
    .chat-input:focus { border-color: var(--tomato); box-shadow: 0 0 0 3px rgba(217, 65, 44, .18); }

    .send-btn {
      flex: none;
      padding: 9px 13px 8px;
      border: 2px solid var(--ink);
      border-radius: 10px;
      background: var(--tomato);
      box-shadow: 3px 3px 0 var(--ink);
      color: #fff8e8;
      font-family: var(--display);
      font-size: .82rem;
      letter-spacing: .03em;
      line-height: 1;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
    }

    .send-btn:hover { background: var(--tomato-dark); }
    .send-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .send-btn:disabled { opacity: .5; cursor: wait; }

    .chat-foot {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px 9px;
      background: var(--cream-2);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .5rem;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    /* Menu column */
    .menu-column {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .menu-board {
      position: relative;
      padding: 18px 15px 16px;
      border: 8px solid var(--wood);
      border-radius: 16px;
      background: #26392c;
      box-shadow: 8px 8px 0 var(--wood-dark);
      color: var(--cream);
    }

    .menu-board::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 50%;
      width: 76px;
      height: 17px;
      border: 1px solid rgba(43, 26, 18, .18);
      background: rgba(255, 244, 214, .62);
      transform: translateX(-50%) rotate(-2deg);
    }

    .menu-kicker {
      margin-bottom: 2px;
      color: var(--cheese);
      font-family: var(--mono);
      font-size: .52rem;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
    }

    .menu-title {
      margin: 0 0 1px;
      color: var(--cheese);
      font-family: var(--display);
      font-size: 1.5rem;
      font-weight: 400;
      text-align: center;
    }

    .menu-sub {
      margin-bottom: 8px;
      color: #e8dcc6;
      font-family: var(--chalk);
      font-size: .94rem;
      text-align: center;
    }

    .menu-item {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px dotted rgba(255, 244, 214, .28);
      font-family: var(--chalk);
      font-size: 1.02rem;
      line-height: 1.2;
    }

    .menu-item:last-of-type { border-bottom: 0; }

    .menu-item small {
      display: block;
      color: #b9c7a8;
      font-family: var(--mono);
      font-size: .48rem;
      letter-spacing: .03em;
    }

    .menu-price {
      color: var(--cheese);
      font-family: var(--mono);
      font-size: .7rem;
      white-space: nowrap;
    }

    .menu-note {
      margin: 9px 0 0;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 244, 214, .3);
      color: #e8dcc6;
      font-family: var(--chalk);
      font-size: .88rem;
      text-align: center;
    }

    .oven-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 12px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      background: var(--cream);
      box-shadow: 6px 6px 0 var(--wood-dark);
    }

    .oven-card img {
      width: 96px;
      height: auto;
      flex: none;
      filter: drop-shadow(2px 3px 0 rgba(43, 26, 18, .14));
    }

    .oven-title {
      margin: 0 0 2px;
      font-family: var(--display);
      font-size: 1.02rem;
      font-weight: 400;
    }

    .oven-status {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--basil-dark);
      font-family: var(--mono);
      font-size: .55rem;
      letter-spacing: .03em;
      text-transform: uppercase;
    }

    .oven-status::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--basil);
      box-shadow: 0 0 0 3px rgba(62, 125, 58, .18);
      animation: pulse 1.8s ease-in-out infinite;
    }

    .oven-copy {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.3;
    }

    .suggestions {
      padding: 13px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: var(--white);
      box-shadow: 5px 5px 0 var(--shadow);
    }

    .suggestions h3 {
      margin: 0 0 2px;
      font-family: var(--display);
      font-size: 1.02rem;
      font-weight: 400;
    }

    .suggestions > p {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: .75rem;
      line-height: 1.3;
    }

    .suggestion {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 7px 9px;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--cream);
      box-shadow: 2px 2px 0 var(--shadow);
      color: var(--ink);
      font-family: var(--body);
      font-size: .78rem;
      font-weight: 700;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
    }

    .suggestion:hover {
      background: var(--cheese);
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0 var(--shadow);
    }

    .suggestion .lang {
      display: block;
      margin-bottom: 2px;
      color: var(--tomato);
      font-family: var(--mono);
      font-size: .47rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    /* How it works */
    .how { padding: 4px 0 24px; }

    .how-head {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 13px;
    }

    .how-head h2 {
      margin: 0;
      font-family: var(--display);
      font-size: 1.55rem;
      font-weight: 400;
      white-space: nowrap;
    }

    .how-head::after {
      content: "";
      flex: 1;
      height: 3px;
      background: repeating-linear-gradient(90deg, var(--wood) 0 10px, transparent 10px 20px);
    }

    .how-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .step-ticket {
      padding: 13px;
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: var(--white);
      box-shadow: 5px 5px 0 var(--wood-dark);
      transform: rotate(-.4deg);
    }

    .step-ticket:nth-child(2) { transform: rotate(.5deg); }

    .step-num {
      color: var(--tomato);
      font-family: var(--display);
      font-size: 1.8rem;
      line-height: 1;
    }

    .step-title {
      margin: 3px 0 2px;
      font-family: var(--display);
      font-size: 1rem;
      font-weight: 400;
    }

    .step-ticket p {
      margin: 0;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.35;
    }

    /* Admin / kitchen */
    .admin-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 26px;
      padding: 30px 0 20px;
    }

    .admin-head h1 {
      margin: 10px 0 0;
      font-family: var(--display);
      font-size: clamp(2.6rem, 5vw, 4.2rem);
      font-weight: 400;
      line-height: .94;
      text-shadow: 3px 3px 0 rgba(246, 196, 69, .55);
    }

    .admin-head h1 em {
      color: var(--tomato);
      font-style: normal;
      text-shadow: 3px 3px 0 var(--cheese);
    }

    .admin-head p {
      max-width: 52ch;
      margin: 10px 0 0;
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.45;
    }

    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .kitchen-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      margin: 8px 0 24px;
      padding: 10px;
      border: 8px solid var(--wood);
      border-radius: 16px;
      background: #26392c;
      box-shadow: 8px 8px 0 var(--wood-dark);
    }

    .kitchen-stat {
      padding: 9px 13px;
      border-right: 1px dashed rgba(255, 244, 214, .24);
    }

    .kitchen-stat:last-child { border-right: 0; }

    .kitchen-label {
      color: var(--cheese);
      font-family: var(--mono);
      font-size: .52rem;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .kitchen-value {
      color: #fff8e8;
      font-family: var(--display);
      font-size: 2.25rem;
      line-height: 1;
    }

    .kitchen-note {
      color: #d8cfb9;
      font-family: var(--chalk);
      font-size: .82rem;
      line-height: 1.2;
    }

    .admin-toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 10px;
    }

    .section-title {
      margin: 0;
      font-family: var(--display);
      font-size: 1.5rem;
      font-weight: 400;
    }

    .filter-card {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 8px 10px;
      border: 3px solid var(--ink);
      border-radius: 10px;
      background: var(--cream);
      box-shadow: 4px 4px 0 var(--shadow);
    }

    .filter-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .48rem;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .date-input {
      width: 144px;
      padding: 6px 7px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--white);
      color: var(--ink);
      font-family: var(--mono);
      font-size: .67rem;
    }

    .ticket-rail {
      position: relative;
      padding-top: 24px;
    }

    .ticket-rail::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: linear-gradient(var(--wood), var(--wood-dark));
      box-shadow: 0 3px 0 rgba(43, 26, 18, .2);
    }

    .tickets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
      gap: 18px;
    }

    .comanda {
      position: relative;
      padding: 17px 13px 12px;
      border: 2px dashed var(--ink);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 5px 5px 0 var(--shadow);
      font-family: var(--mono);
      font-size: .67rem;
      line-height: 1.45;
      transform: rotate(-.4deg);
    }

    .comanda:nth-child(even) { transform: rotate(.45deg); }

    .comanda::before {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      width: 56px;
      height: 15px;
      border: 1px solid rgba(43, 26, 18, .2);
      background: rgba(246, 196, 69, .75);
      transform: translateX(-50%) rotate(-2deg);
    }

    .comanda-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--ink);
      font-family: var(--display);
      font-size: .84rem;
      font-weight: 400;
      letter-spacing: .03em;
    }

    .comanda-table { color: var(--tomato); }

    .comanda-name {
      margin: 8px 0 1px;
      font-family: var(--body);
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .comanda-time {
      color: var(--ink);
      font-family: var(--display);
      font-size: .98rem;
      line-height: 1.2;
    }

    .comanda-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 3px;
    }

    .comanda-row strong { text-align: right; }

    .comanda-code {
      margin-top: 6px;
      padding-top: 5px;
      border-top: 1px dotted var(--line);
      color: var(--muted);
      font-size: .58rem;
      overflow-wrap: anywhere;
    }

    .comanda-stamp {
      position: absolute;
      top: 43px;
      right: 9px;
      padding: 2px 5px;
      border: 2px solid var(--basil);
      border-radius: 3px;
      background: rgba(255, 253, 246, .72);
      color: var(--basil);
      font-family: var(--display);
      font-size: .53rem;
      letter-spacing: .04em;
      opacity: .8;
      transform: rotate(7deg);
    }

    .comanda-stamp.is-past { border-color: var(--muted); color: var(--muted); }

    .comanda-cancel {
      width: 100%;
      margin-top: 9px;
      padding: 6px 8px;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--cream);
      box-shadow: 2px 2px 0 var(--shadow);
      color: var(--ink);
      font-family: var(--display);
      font-size: .68rem;
      letter-spacing: .03em;
      cursor: pointer;
    }

    .comanda-cancel:hover { background: var(--tomato); color: #fff8e8; }

    .admin-note {
      margin: 18px 0 0;
      color: var(--muted);
      font-family: var(--mono);
      font-size: .54rem;
      letter-spacing: .03em;
    }

    .empty {
      padding: 38px 22px;
      border: 3px dashed var(--wood);
      border-radius: 14px;
      background: var(--cream);
      box-shadow: 6px 6px 0 var(--shadow);
      text-align: center;
    }

    .empty img { width: 128px; height: auto; }

    .empty h2 {
      margin: 6px 0 4px;
      font-family: var(--display);
      font-size: 1.6rem;
      font-weight: 400;
    }

    .empty p {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: .84rem;
    }

    /* Footer */
    .site-footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 0 34px;
      border-top: 3px solid var(--ink);
      color: var(--muted);
      font-family: var(--mono);
      font-size: .54rem;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .site-footer a { text-decoration: none; border-bottom: 1px solid var(--line); }
    .site-footer a:hover { color: var(--tomato); border-color: var(--tomato); }

    @keyframes rise {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: .3; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-2px); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-5px) rotate(1deg); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(62, 125, 58, .18); }
      50% { box-shadow: 0 0 0 6px rgba(62, 125, 58, .06); }
    }

    @media (max-width: 980px) {
      .scene-head { grid-template-columns: 1fr; gap: 18px; padding-top: 24px; }
      .scene-art { min-height: 220px; }
      .salon-grid { grid-template-columns: 1fr; }
      .menu-column { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
      .suggestions { grid-column: 1 / -1; }
      .table-surface { height: 620px; }
      .how-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 680px) {
      .page { width: min(100% - 28px, 1240px); }
      .header-inner { min-height: 68px; gap: 10px; }
      .brand-chef { width: 44px; height: 44px; }
      .brand-name { font-size: 1.48rem; }
      .brand-sub { display: none; }
      .site-nav { gap: 12px; }
      .site-nav a { font-size: .76rem; }
      .site-nav a:nth-child(3) { display: none; }
      .open-badge { display: none; }
      .marquee-inner { justify-content: flex-start; padding-left: 14px; font-size: .55rem; }
      .scene-head { padding: 20px 0 18px; }
      .scene-copy h1 { font-size: clamp(2.5rem, 12vw, 3.4rem); }
      .lede { font-size: .9rem; }
      .scene-art { min-height: 205px; }
      .scene-plate { width: 188px; height: 188px; }
      .scene-plate img { width: 154px; }
      .chef-bubble { max-width: 150px; padding: 8px 10px; font-size: .75rem; top: 0; right: 0; }
      .specials-sticker { font-size: .62rem; padding: 6px 9px 5px; }
      .table-card { padding: 10px; border-radius: 15px; box-shadow: 5px 5px 0 var(--wood-dark); }
      .table-surface { height: 580px; }
      .chat-head { padding: 9px 10px; }
      .waiter-avatar { width: 38px; height: 38px; }
      .waiter-avatar img { width: 33px; height: 33px; }
      .chat-title { font-size: 1rem; }
      .chat-sub { font-size: .48rem; }
      .online { font-size: .58rem; }
      .chat-log { padding: 13px 10px; gap: 12px; }
      .msg { max-width: 97%; gap: 5px; }
      .msg-avatar { width: 27px; height: 27px; }
      .msg-avatar img { width: 23px; height: 23px; }
      .msg-bot .msg-content { min-width: 230px; }
      .bubble { font-size: .84rem; padding: 8px 10px; }
      .chat-form { padding: 8px; }
      .chat-input { font-size: .84rem; padding: 8px 10px; }
      .send-btn { font-size: .72rem; padding: 8px 10px 7px; }
      .chat-foot { padding: 0 9px 7px; font-size: .46rem; }
      .chat-foot span:last-child { display: none; }
      .menu-column { grid-template-columns: 1fr; }
      .suggestions { grid-column: auto; }
      .how-grid { grid-template-columns: 1fr; }
      .admin-head { display: block; padding-top: 22px; }
      .admin-actions { margin-top: 16px; }
      .kitchen-board { grid-template-columns: 1fr; }
      .kitchen-stat { border-right: 0; border-bottom: 1px dashed rgba(255, 244, 214, .24); }
      .kitchen-stat:last-child { border-bottom: 0; }
      .admin-toolbar { display: block; }
      .filter-card { margin-top: 12px; width: 100%; justify-content: flex-start; }
      .tickets { grid-template-columns: 1fr; }
      .site-footer { display: block; line-height: 1.7; }
      .site-footer span { display: block; }
      .site-footer span + span { margin-top: 4px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="awning" aria-hidden="true"></div>

  <header class="site-header">
    <div class="page header-inner">
      <a class="brand" href="/" aria-label="Pizzería Artusi, inicio">
        <img class="brand-chef" src="/static/pizza-chef.svg" alt="">
        <span class="brand-copy">
          <span class="brand-name">Pizzería <strong>Artusi</strong></span>
          <span class="brand-sub">Horno de leña · desde 1987</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="/#mesa">Pedir mesa</a>
        <a href="/admin">Comandas</a>
        <a href="/docs">API</a>
        <span class="open-badge">Abierto</span>
      </nav>
    </div>
  </header>

  <div class="marquee" aria-hidden="true">
    <div class="page marquee-inner">
      <span>Masa madre</span>
      <span>Horno de leña</span>
      <span>Mozzarella fresca</span>
      <span>Abierto 12:00–23:00</span>
    </div>
  </div>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="page site-footer">
    <span>Pizzería Artusi · pedidos por chat</span>
    <span>Hecho con Python, FastAPI y PostgreSQL · <a href="https://github.com/JeremyE7" target="_blank" rel="noreferrer">GitHub</a></span>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
